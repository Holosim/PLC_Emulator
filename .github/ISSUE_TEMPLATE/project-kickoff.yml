name: Project Kickoff
description: Start a new project. Submitting this automatically hands it to the Solutions Architect.
title: "Project Kickoff: "
labels: ["agent:solutions-architect"]
body:
  - type: markdown
    attributes:
      value: |
        A short brief is enough — the Solutions Architect will interview
        you for everything else through its own process. You don't need
        to explain what the Solutions Architect should do; that's
        already defined in its role file and happens automatically once
        this issue is submitted.
  - type: textarea
    id: brief
    attributes:
      label: What are we building?
      description: >-
        Mention anything you already know for certain — target
        platform, language, must-have tools — so it's captured as
        confirmed rather than asked about. Everything else can be left
        for the interview.
      placeholder: |
        Build a Sudoku solver for a Windows console, in C++, using
        Visual Studio 2022 as the IDE.
    validations:
      required: true
