name: stall-recovery

# Scheduled sweep: finds issues stuck at status:in-progress,
# status:ready-for-commit, or status:ready-for-rtvm-update with no
# recent activity, and recovers them. Never touches status:blocked,
# status:needs-human, status:on-hold, or status:waiting-on-lock --
# those are intentional pauses waiting on a human or a dependency,
# not accidental stalls.
#
# Manual runs (workflow_dispatch) can set force_immediate to recover
# everything matching right now, bypassing the normal 1-hour age
# check -- this is the "clear the stalls" command, invoked directly
# rather than waiting for the scheduled sweep.
#
# Heuristic for where to route a recovered issue: if the last comment
# named a specific hand-off target (e.g. "Handing off to
# `agent:test-engineer`") that differs from the current label, the
# hand-off almost certainly described an action that never actually
# executed -- route there directly rather than re-running the role
# that already finished its own turn. Otherwise, just retrigger the
# role currently holding the issue.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_immediate:
        description: "Skip the 1-hour age check and recover every open, non-in-progress hand-off right now"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Find and recover stalled issues
        run: |
          NOW=$(date -u +%s)
          if [[ "${{ inputs.force_immediate }}" == "true" ]]; then
            THRESHOLD_SECONDS=0
            echo "force_immediate set -- recovering everything matching, regardless of age."
          else
            THRESHOLD_SECONDS=3600
          fi

          gh issue list --label "status:in-progress,status:ready-for-commit,status:ready-for-rtvm-update" --state open \
            --json number,labels,updatedAt --repo "${{ github.repository }}" \
            | jq -c '.[]' \
            | while read -r issue; do
                NUMBER=$(echo "$issue" | jq -r '.number')
                LABELS=$(echo "$issue" | jq -r '.labels[].name')
                AGENT_LABEL=$(echo "$LABELS" | grep '^agent:' || true)

                if [[ -z "$AGENT_LABEL" ]]; then
                  echo "Issue #$NUMBER: matched status label with no agent:* label -- not this sweep's problem, skipping."
                  continue
                fi

                STATUS_LABEL=$(echo "$LABELS" | grep -E '^status:(in-progress|ready-for-commit|ready-for-rtvm-update)$' | head -1)

                LAST_COMMENT_TIME=$(gh issue view "$NUMBER" --json comments \
                  --repo "${{ github.repository }}" \
                  -q '.comments | if length > 0 then .[-1].createdAt else null end')
                if [[ -z "$LAST_COMMENT_TIME" || "$LAST_COMMENT_TIME" == "null" ]]; then
                  LAST_COMMENT_TIME=$(echo "$issue" | jq -r '.updatedAt')
                fi

                LAST_EPOCH=$(date -u -d "$LAST_COMMENT_TIME" +%s)
                AGE=$(( NOW - LAST_EPOCH ))

                if (( AGE < THRESHOLD_SECONDS )); then
                  continue
                fi

                echo "Issue #$NUMBER: no activity in $(( AGE / 60 ))m, currently $AGENT_LABEL / $STATUS_LABEL -- recovering."

                LAST_COMMENT_BODY=$(gh issue view "$NUMBER" --json comments \
                  --repo "${{ github.repository }}" \
                  -q '.comments | if length > 0 then .[-1].body else "" end')

                NEXT_LINE=$(echo "$LAST_COMMENT_BODY" | grep -i '^\*\*Next:\*\*' | tail -1 || true)

                if echo "$NEXT_LINE" | grep -qE '`agent:[a-z-]+`'; then
                  TARGET=$(echo "$NEXT_LINE" | grep -oE '`agent:[a-z-]+`' | tr -d '`')
                  gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                    --body "Stall recovery: no activity for over an hour. The Next line declared a hand-off to $TARGET that never took effect -- routing there directly."
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$AGENT_LABEL" --remove-label "$STATUS_LABEL"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --add-label "$TARGET"
                elif echo "$NEXT_LINE" | grep -qi 'waiting on human reply'; then
                  gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                    --body "Stall recovery: no activity for over an hour. The Next line said this is waiting on a human reply -- clearing $STATUS_LABEL only, leaving $AGENT_LABEL in place."
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$STATUS_LABEL"
                else
                  # "Continuing", or no parseable Next line at all -- the
                  # safest recovery is retriggering whoever currently holds
                  # the issue.
                  gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                    --body "Stall recovery: no activity for over an hour. Retriggering $AGENT_LABEL."
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$STATUS_LABEL"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$AGENT_LABEL"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --add-label "$AGENT_LABEL"
                fi
              done
