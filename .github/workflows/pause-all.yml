name: pause-all

# Emergency stop / resume, manual-trigger only -- never runs on any
# schedule or automatic event. Costs zero Anthropic tokens; this is
# plain gh CLI, safe to run even when worried about an impending
# budget limit, since running it never draws against that budget.
#
# Pausing removes every agent:* label currently on an open issue,
# recording what was removed in that issue's own "pause-record" so
# resume knows exactly what to put back. Nothing else changes --
# comments, status:* labels, and everything else stay exactly as
# they were, so no in-progress work or state is lost, just the
# trigger that would let another run start.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause or resume"
        type: choice
        options:
          - pause
          - resume
        required: true

permissions:
  issues: write

jobs:
  pause-or-resume:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Pause all agent work
        if: inputs.action == 'pause'
        run: |
          gh issue list --label "agent:product-manager,agent:solutions-architect,agent:systems-engineer,agent:software-engineer,agent:test-engineer,agent:cicd" \
            --state open --json number,labels --repo "${{ github.repository }}" \
            | jq -c '.[]' \
            | while read -r issue; do
                NUMBER=$(echo "$issue" | jq -r '.number')
                AGENT_LABEL=$(echo "$issue" | jq -r '.labels[].name' | grep '^agent:')

                if [[ -z "$AGENT_LABEL" ]]; then
                  continue
                fi

                echo "Pausing #$NUMBER (was $AGENT_LABEL)"
                gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                  --body "Paused: all agent work halted manually (pending budget/session concern). This issue was labeled \`$AGENT_LABEL\` when paused -- run pause-all with 'resume' to restore it and pick back up."
                gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                  --remove-label "$AGENT_LABEL" --add-label "status:paused"
              done
          echo "Pause complete. dependency-check, lock-retry, and stall-recovery still run on schedule but will find nothing to act on, since no issue carries an agent:* label anymore."

      - name: Resume all paused work
        if: inputs.action == 'resume'
        run: |
          gh issue list --label "status:paused" --state open \
            --json number,body,comments --repo "${{ github.repository }}" \
            | jq -c '.[]' \
            | while read -r issue; do
                NUMBER=$(echo "$issue" | jq -r '.number')

                PAUSE_COMMENT=$(echo "$issue" | jq -r '.comments[] | select(.body | startswith("Paused:")) | .body' | tail -1)
                AGENT_LABEL=$(echo "$PAUSE_COMMENT" | grep -oE '`agent:[a-z-]+`' | tr -d '`' | head -1)

                if [[ -z "$AGENT_LABEL" ]]; then
                  echo "Issue #$NUMBER: status:paused but no parseable pause record -- skipping, needs manual review."
                  continue
                fi

                echo "Resuming #$NUMBER (restoring $AGENT_LABEL)"
                gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                  --body "Resumed: restoring $AGENT_LABEL."
                gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                  --remove-label "status:paused"
                gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                  --add-label "$AGENT_LABEL"
              done
          echo "Resume complete."
