# THIS FILE IS NOT ACTIVE WHERE IT SITS. Copy it to
#   .github/workflows/build-and-test.yml
# It lives under docs/ci/ for the same reason docs/ci/windows-verification.yml
# does: the relay GitHub App installation lacks the `workflows` permission, so
# no agent in this pipeline can push a file under .github/workflows/ — this
# was attempted and rejected on issue #5 ("refusing to allow a GitHub App to
# create or update workflow ... without `workflows` permission"). Either
# grant that permission, after which CI/CD maintains this file directly, or
# copy it across once by hand. Nothing below this point needs further
# customization — it's ready to copy as-is.

name: build-and-test

# Build/test gate for NFR-501 (Windows/Linux behavioral parity): runs
# `dotnet build` + `dotnet test` on both ubuntu-latest and
# windows-latest for every push to trunk or an issue-<n> feature
# branch, per docs/SDD.md's target-platform verification strategy.
# This is a continuous per-feature gate, distinct from
# windows-verification.yml (a separate, late-stage DELIV-900 check).

on:
  push:
    branches:
      - main
      - "issue-*"
    paths:
      - "**/*.sln"
      - "**/*.csproj"
      - "**/*.cs"
      - "global.json"
      - ".github/workflows/build-and-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet build
        run: dotnet build PlcEmulator.sln --configuration Release

      - name: dotnet test
        run: dotnet test PlcEmulator.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          retention-days: 30
          if-no-files-found: warn
